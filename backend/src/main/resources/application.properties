spring.application.name=FactoryFlow
server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/factoryflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Hemant@10
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

